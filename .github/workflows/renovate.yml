name: Renovate

on:
  schedule:
    # Staggered against the other organisations' runners. Scheduled runs on
    # this account fire hours behind their cron whatever is asked for, so the
    # exact minute matters less than not asking at the same instant as a
    # neighbour.
    - cron: '47 5 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.11
        with:
          configurationFile: config.js
          # ⛔ RENOVATE_TOKEN must exist as a repository secret on this
          # repository. An unset secret expands to the empty string and the
          # action then fails with "'token' MUST be passed using its input or
          # the 'RENOVATE_TOKEN' environment variable" — in about ten seconds,
          # every night, which reads as activity to any check that only asks
          # whether runs happen. Sixteen organisations were in that state on
          # 2026-10-31, none of which had ever received a dependency update.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
